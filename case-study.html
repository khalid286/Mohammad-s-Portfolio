<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Case Study — Mohammad Khalid Daneshwar</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .case {
        padding: 90px 0 130px;
      }
      .back {
        font-size: 14px;
      }
      .case-hero {
        padding: 70px 0;
      }
      .case-hero h1 {
        font-size: clamp(52px, 8vw, 96px);
        margin-bottom: 20px;
      }
      .case-sub {
        font-size: 24px;
        max-width: 820px;
        color: #4f544f;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 28px 0;
        margin: 50px 0;
      }
      .facts b {
        display: block;
        font-size: 12px;
        letter-spacing: 0.1em;
        margin-bottom: 5px;
      }
      .hero-img {
        width: 100%;
        border: 1px solid var(--line);
        background: white;
        padding: 10px;
      }
      .story {
        display: grid;
        grid-template-columns: 0.5fr 1.5fr;
        gap: 70px;
        padding: 80px 0;
        border-bottom: 1px solid var(--line);
      }
      .story h2 {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0;
      }
      .story p {
        font-size: 20px;
        max-width: 780px;
        margin: 0 0 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 40px;
      }
      .gallery img {
        width: 100%;
        border: 1px solid var(--line);
        padding: 8px;
        background: white;
      }
      @media (max-width: 700px) {
        .facts,
        .story,
        .gallery {
          grid-template-columns: 1fr;
        }
        .story {
          gap: 22px;
        }
        .case {
          padding-top: 50px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Mohammad Khalid Daneshwar</a>
      <nav>
        <a href="index.html#work">Work</a><a href="index.html#about">About</a
        ><a href="index.html#contact">Contact</a>
      </nav>
    </header>
    <main class="case wrap">
      <a class="back" href="index.html#work">← Selected work</a>
      <section class="case-hero">
        <p id="meta" class="eyebrow"></p>
        <h1 id="title"></h1>
        <p id="sub" class="case-sub"></p>
        <div class="facts">
          <div><b>ROLE</b><span id="role"></span></div>
          <div><b>TOOLS / WORKFLOW</b><span id="tools"></span></div>
          <div><b>STATUS</b><span id="status"></span></div>
        </div>
        <img id="heroimg" class="hero-img" alt="" />
      </section>
      <section class="story">
        <h2>The challenge</h2>
        <div id="challenge"></div>
      </section>
      <section class="story">
        <h2>Approach</h2>
        <div id="approach"></div>
      </section>
      <section class="story">
        <h2>Development</h2>
        <div id="development"></div>
      </section>
      <section class="story">
        <h2>Outcome</h2>
        <div id="outcome"></div>
      </section>
      <div id="gallery" class="gallery"></div>
    </main>
    <script src="case-study.js"></script>
  </body>
</html>
